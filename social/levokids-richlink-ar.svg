  <foreignObject x="650" y="176" width="480" height="204">
    <div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" style="width:480px;height:204px;text-align:right;color:#11272F;font-family:Tajawal, 'Avenir Next', 'Segoe UI', sans-serif;">
      <div style="font-size:64px;line-height:1.17;font-weight:800;letter-spacing:0;">خطوات صغيرة.<br/>نمو ثابت.</div>
      <div style="margin-top:22px;color:#37525A;font-size:30px;line-height:1.42;font-weight:500;letter-spacing:0;">تقدم واضح ومكافآت مستحقة.</div>
    </div>
  </foreignObject>

  <foreignObject x="664" y="472" width="466" height="50">
    <div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" style="width:466px;height:50px;display:flex;gap:20px;justify-content:flex-start;align-items:center;font:700 23px/1 Tajawal, 'Avenir Next', 'Segoe UI', sans-serif;">
