  <foreignObject x="830" y="76" width="172" height="64">
    <div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" style="width:172px;height:64px;display:flex;align-items:center;justify-content:flex-end;color:#11272F;font:700 42px/1.1 Tajawal, 'Avenir Next', 'Segoe UI', sans-serif;">
      ليڤو
