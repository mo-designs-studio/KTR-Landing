  <g transform="translate(1026 70)">
    <rect width="76" height="76" rx="22" fill="#0A5F58"/>
    <path d="M23 53V21h14v20h17v12H23Z" fill="#FFFEFA"/>
    <path d="M44 34h14V21h-8v5h-6v8Z" fill="#F97316"/>
