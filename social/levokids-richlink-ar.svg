<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">معاينة رابط ليڤو</title>
  <desc id="desc">معاينة لعلامة ليڤو تعرض رسالة خطوات صغيرة ونمو ثابت بجانب شاشات تقدم المنتج.</desc>
  <defs>
    <linearGradient id="bg" x1="1200" y1="0" x2="0" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFEFA"/>
      <stop offset="0.53" stop-color="#F7FAF8"/>
      <stop offset="1" stop-color="#E7F5EF"/>
    </linearGradient>
    <linearGradient id="panel" x1="550" y1="96" x2="170" y2="530" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A5F58"/>
      <stop offset="1" stop-color="#11272F"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#11272F" flood-opacity="0.16"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#11272F" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
